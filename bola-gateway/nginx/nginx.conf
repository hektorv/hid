# The perimeter: every request under /projects/ is checked by the validator
# (auth_request) before it is forwarded to the unmodified backend. A 401 or 403
# from the validator is answered here; the backend never sees the request.

worker_processes auto;
events { worker_connections 1024; }

http {
    log_format bola '$remote_addr "$request" $status verdict=$bola_verdict '
                    'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout bola;
    error_log /dev/stderr warn;

    upstream backend   { server backend:8000;   keepalive 32; }
    upstream validator { server validator:8001; keepalive 32; }

    server {
        listen 8080;

        set $bola_verdict "-";

        # The subrequest: no body, the original URI and method, the caller's headers.
        location = /_bola/validate {
            internal;
            proxy_pass http://validator/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /projects {
            auth_request /_bola/validate;
            auth_request_set $bola_verdict $upstream_http_x_bola_verdict;
            add_header X-Bola-Verdict $bola_verdict always;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Sign-in and health are outside the hierarchy.
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
