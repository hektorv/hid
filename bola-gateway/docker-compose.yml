# The lab: the vulnerable backend, the validator and Nginx in front.
#   python -m bola_gateway.secrets > .env && docker compose up --build
# Gateway: http://localhost:${GATEWAY_PORT:-8080}
# Backend bypassing it (baseline): http://localhost:${BACKEND_PORT:-8081}
# MODE=observe lets everything through and only records verdicts.
x-lab: &lab
  build:
    context: ..
    dockerfile: bola-gateway/Dockerfile
  environment:
    MASTER_KEY: ${MASTER_KEY:?run python -m bola_gateway.secrets > .env}
    TOKEN_KEY: ${TOKEN_KEY:?run python -m bola_gateway.secrets > .env}
    PREFIX_BYTES: ${PREFIX_BYTES:-3}
    MODE: ${MODE:-enforce}

services:
  backend:
    <<: *lab
    command: uvicorn --factory bola_gateway.backend:app --host 0.0.0.0 --port 8000
    ports: ["${BACKEND_PORT:-8081}:8000"]

  validator:
    <<: *lab
    command: uvicorn --factory bola_gateway.validator:app --host 0.0.0.0 --port 8001

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    depends_on: [backend, validator]
